# The clipboard: a Deployment says "keep three copies of status-board running".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-board
  labels:
    app: status-board
spec:
  # Desired state: three pods (crates). Change this number and the tower follows.
  replicas: 3
  # Which pods belong to this Deployment: those labelled app=status-board.
  selector:
    matchLabels:
      app: status-board
  # Rolling update: open one new crate first, never close an old one until it answers.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: status-board
    spec:
      # The app is PID 1 and ignores SIGTERM, so don't wait the default 30 s when a pod is closed.
      terminationGracePeriodSeconds: 5
      # Spread the pods across the worker nodes instead of stacking them on one hub.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: status-board
      # If a node goes dark, give up on its pods after 30 s (the default is 300 s) so the demo is quick.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      containers:
        - name: status-board
          # The packed crate. v1 was built locally and loaded into kind, so never pull it.
          image: status-board:v1
          imagePullPolicy: IfNotPresent
          # The app listens on 8080 inside the container.
          ports:
            - containerPort: 8080
          # Readiness: only send visitors to this pod once /health answers.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          # Liveness: restart the container if /health stops answering.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          # Floor space: what the pod is promised (requests) and the most it may use (limits).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
